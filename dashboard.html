<!DOCTYPE html>
<html>
<head>
  <title>Test Tracker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body style="background:#0f172a;color:white;font-family:Arial;padding:20px;">

<h2>Test Add Button</h2>

<input id="amount" placeholder="Amount"><br><br>
<input id="returned" placeholder="Returned"><br><br>

<button onclick="addTransaction()">Add</button>

<p id="output"></p>

<script>
function addTransaction() {
  let amount = document.getElementById("amount").value;
  let returned = document.getElementById("returned").value;

  document.getElementById("output").innerText =
    "Added: " + amount + " → " + returned;
}
</script>

</body>
</html>
